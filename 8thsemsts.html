    // Helper function to escape HTML
    function escapeHTML(str) {
      return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Render the quiz
    const quizContainer = document.getElementById('quiz-container');
    quizData.forEach((section, topicIdx) => {
      const topicDiv = document.createElement('div');
      topicDiv.className = 'topic';

      const topicTitle = document.createElement('div');
      topicTitle.className = 'topic-title';
      topicTitle.textContent = section.topic;
      topicDiv.appendChild(topicTitle);

      section.questions.forEach((qObj, qIdx) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'question-block';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = escapeHTML(qObj.q);
        qBlock.appendChild(qText);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        qObj.options.forEach((opt, optIdx) => {
          const optLi = document.createElement('li');
          optLi.className = 'option';

          const optId = `topic${topicIdx}_q${qIdx}_opt${optIdx}`;
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `topic${topicIdx}_q${qIdx}`;
          radio.id = optId;
          radio.value = optIdx;

          // Option click handler
          radio.addEventListener('change', function() {
            // Remove previous coloring
            const allOpts = optionsList.querySelectorAll('.option');
            allOpts.forEach(li => li.classList.remove('correct', 'incorrect'));

            if (optIdx === qObj.answer) {
              optLi.classList.add('correct');
            } else {
              optLi.classList.add('incorrect');
              // Also mark the correct one
              allOpts[qObj.answer].classList.add('correct');
            }
          });

          const label = document.createElement('label');
          label.setAttribute('for', optId);
          label.innerHTML = escapeHTML(opt);

          optLi.appendChild(radio);
          optLi.appendChild(label);
          optionsList.appendChild(optLi);
        });

        qBlock.appendChild(optionsList);
        topicDiv.appendChild(qBlock);
      });

      quizContainer.appendChild(topicDiv);
    });
